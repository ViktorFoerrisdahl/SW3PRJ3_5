name: Dokumentationskontekst

on:
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - '!docs/context/**'
      - 'code/tools/context/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'code/tools/context/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    name: Konvertér og test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/tools/context/requirements.txt
      - name: Installér konverteringsværktøjer
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          python -m pip install -r code/tools/context/requirements.txt
      - name: Test konvertering
        run: python -m unittest discover -s code/tools/context/tests -v
      - name: Generér kontekst
        run: python code/tools/context/generate.py
      - name: Kontrollér kildeindeks
        run: python code/tools/context/generate.py --check
      - name: Gem kontekst til review og fejlsøgning
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-context
          path: docs/context/
          if-no-files-found: error
          retention-days: 14

  commit:
    name: Gem kontekst på branch
    needs: convert
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: documentation-context
          path: ${{ runner.temp }}/documentation-context
      - name: Erstat genererede filer
        env:
          CONTEXT_ARTIFACT: ${{ runner.temp }}/documentation-context
        run: |
          mkdir -p docs/context
          rsync -a --delete "$CONTEXT_ARTIFACT/" docs/context/
      - name: Commit og push uden force
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- docs/context
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update generated project context'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
